name: 🐞 Bug 报告
description: 报告引导、驱动或功能异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先看 README 的「已知限制」和 [DISCLAIMER](../blob/main/DISCLAIMER.md)。

        ⚠️ **粘贴任何日志前，请删除序列号、MLB、UUID、MAC 等隐私信息。**

  - type: dropdown
    id: board
    attributes:
      label: 机型 / 主板
      description: 本仓库只针对 8F06 验证过
      options:
        - HP HyperX OMEN PRO 16（主板 8F06）
        - 其他 HP 8F06 变体
        - 其他机型（请在下方说明）
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 版本与 build
      placeholder: "26.0 (25A354)"
    validations:
      required: true

  - type: input
    id: opencore
    attributes:
      label: OpenCore 版本
      placeholder: "1.0.9"
    validations:
      required: true

  - type: dropdown
    id: nvidia
    attributes:
      label: 是否安装了 NullMoth NVIDIA 驱动
      options:
        - 已安装
        - 未安装
        - 不确定
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 具体现象、出现频率、从哪一步开始
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 开机 ...
        2. 打开 ...
        3. 出现 ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 诊断信息
      description: 请执行以下命令并粘贴输出（记得脱敏）
      value: |
        ```bash
        # 1. 已加载的驱动
        kmutil showloaded | grep -Ei 'lilu|virtualsmc|whatevergreen|mtk|nvrm|voodoo|applealc|simplehda'

        # 2. 硬件概要
        system_profiler SPHardwareDataType | head -12

        # 3. 相关设备
        system_profiler SPDisplaysDataType SPBluetoothDataType SPAudioDataType | head -40

        # 4. 电源状态（电池/交流电问题必填）
        pmset -g batt
        ```
    validations:
      required: true

  - type: textarea
    id: bootlog
    attributes:
      label: OpenCore 启动日志（可选）
      description: EFI 分区根目录的 `opencore-*.txt`，请先脱敏
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已阅读 README 的「已知限制」
          required: true
        - label: 我已删除日志中的序列号 / MLB / UUID / MAC
          required: true
        - label: 我使用的是自己生成的 SMBIOS，而不是仓库里的占位值
          required: true
